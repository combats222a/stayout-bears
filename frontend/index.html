  <body>
    <!--
      Ранний, синхронный, не-module скрипт — выполняется до парсинга
      /src/main.tsx и до первого рендера React. Приложение сам по себе SPA
      без SSR, так что реальный текстовый флэш "не тот язык → тот язык"
      здесь и так невозможен (React читает тот же locale синхронно в
      инициализаторе useState при самом первом рендере). Но атрибут
      <html lang> важен для скринридеров и SEO сам по себе, и его лучше
      выставить как можно раньше, а не ждать монтирования React — поэтому
      он выставляется отдельно, прямо здесь.

      Логика ЗЕРКАЛИТ src/i18n/config.ts, detector.ts и storage.ts —
      единственное место, где она продублирована намеренно, потому что
      обычный <script type="module"> тут неприменим (нужен результат до
      появления root). При изменении этих трёх файлов не забыть обновить
      и этот блок.
    -->
    <script>
      (function () {
        var STORAGE_KEY = 'locale';
        var SUPPORTED = ['ru', 'en'];
        var locale = null;
        try {
          var saved = window.localStorage.getItem(STORAGE_KEY);
          if (saved && SUPPORTED.indexOf(saved) !== -1) locale = saved;
        } catch (e) {}
        if (!locale) {
          var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
          for (var i = 0; i < langs.length; i++) {
            var primary = (langs[i] || '').toLowerCase().split('-')[0];
            if (primary === 'en') { locale = 'en'; break; }
            if (primary === 'ru') { locale = 'ru'; break; }
          }
        }
        document.documentElement.lang = locale || 'ru';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
